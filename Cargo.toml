[package]
name = "chainsentinel"
version = "0.2.0"
edition = "2021"
description = "Private Telegram-controlled Solana monitoring and alerting platform"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = "0.7"
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
bs58 = "0.5"

[dev-dependencies]
mockito = "1"
regex = "1.13.1"
# `start_paused` lets retry/backoff tests run instantly instead of really sleeping.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
